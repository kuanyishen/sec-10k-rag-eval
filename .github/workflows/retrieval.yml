name: retrieval
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install sentence-transformers rank-bm25 lxml pyyaml numpy google-genai anthropic
      - run: PYTHONPATH=src python -m rag_eval.run_retrieval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "Sky Shen"
          git config user.email "noreply@github.com"
          git add results
          git commit -m "Retrieval experiment results" || echo "nothing new"
          git pull --rebase
          git push
