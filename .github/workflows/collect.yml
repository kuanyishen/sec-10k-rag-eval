name: collect
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml
      - run: PYTHONPATH=src python -m rag_eval.edgar
      - name: Commit filings and facts
        run: |
          git config user.name "Sky Shen"
          git config user.email "noreply@github.com"
          git add data/raw
          git commit -m "Collect latest 10-K filings and XBRL facts" || echo "nothing new"
          git push
